    <h1>نظام متابعة تحويلات الموردين</h1>
    <p class="co" id="authCo"></p>
    <form id="loginForm" class="stack" autocomplete="on">
      <div><label class="lbl" for="lgUser">اسم الدخول</label><input class="field" id="lgUser" autocomplete="username" required dir="ltr"></div>
      <div><label class="lbl" for="lgPass">كلمة المرور</label><input class="field" id="lgPass" type="password" autocomplete="current-password" required dir="ltr"></div>
      <div id="lgErr" class="err" hidden></div>
      <button class="btn primary" type="submit" id="lgBtn">دخول</button>
    </form>
    <form id="setupForm" class="stack" hidden>
      <p class="note info" style="margin:0">أول تشغيل للنظام: أنشئ حساب مدير النظام.</p>
      <div><label class="lbl req" for="suCo">اسم الشركة</label><input class="field" id="suCo" required></div>
      <div><label class="lbl req" for="suName">اسمك</label><input class="field" id="suName" required></div>
      <div class="grid2">
        <div><label class="lbl req" for="suUser">اسم الدخول</label><input class="field" id="suUser" required dir="ltr" placeholder="admin"></div>
        <div><label class="lbl req" for="suPass">كلمة المرور</label><input class="field" id="suPass" type="password" required dir="ltr"></div>
      </div>
      <div><label class="lbl" for="suMail">البريد الإلكتروني</label><input class="field" id="suMail" type="email" dir="ltr"></div>
      <div id="suErr" class="err" hidden></div>
      <button class="btn primary" type="submit" id="suBtn">إنشاء الحساب والدخول</button>
    </form>
    <div id="lockBox" class="stack" hidden>
      <div class="note bad" style="text-align:center"><h4 id="lockT">انتهت صلاحية الترخيص</h4><span id="lockM"></span></div>
      <div style="text-align:center;font-size:13px">للتفعيل أو التجديد أرسل رقم النسخة لمعدّ النظام <b>أصيل أمين</b> ثم أدخل كود التفعيل هنا.</div>
      <div class="lic-id">رقم النسخة <b class="num" id="lockId" dir="ltr"></b></div>
      <form id="lockForm" class="stack"><textarea class="field num" id="lockCode" dir="ltr" rows="3" placeholder="كود التفعيل" aria-label="كود التفعيل"></textarea><div id="lockErr" class="err" hidden></div><button class="btn primary" id="lockGo" type="submit">تفعيل النسخة</button></form>
    </div>
  </div>
